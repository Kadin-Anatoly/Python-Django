{% extends 'base.html' %}

{% block title %}{{ post.title }} · Мой блог{% endblock %}

{% block content %}
    <article class="post-detail">
        <h1>{{ post.title }}</h1>
        <p class="post-meta">
            <a href="{% url 'blog:category_posts' post.category.slug %}">{{ post.category.name }}</a>
            · {{ post.published_at|date:'d.m.Y H:i' }}
        </p>
        {% if post.image %}
            <img class="post-image" src="{{ post.image.url }}" alt="{{ post.title }}">
        {% endif %}
        <div class="post-text">{{ post.text|linebreaks }}</div>
        <p><a href="{% url 'blog:index' %}">← На главную</a></p>
    </article>
{% endblock %}
